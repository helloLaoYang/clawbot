services:
  clawbot:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - clawbot-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  clawbot-data:
